name: TurkMedya Telegram Request Approval FREE

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

concurrency:
  group: turkmedya-telegram-request-free
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  telegram-request:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout accepted FIX10 branch
        uses: actions/checkout@v4
        with:
          ref: v62-weekly-auto-test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Poll Firebase requests and Telegram buttons
        id: poll
        working-directory: automation
        env:
          VARDIYA_TELEGRAM_BOT_TOKEN: ${{ secrets.VARDIYA_TELEGRAM_BOT_TOKEN }}
          VARDIYA_TELEGRAM_CHAT_ID: ${{ secrets.VARDIYA_TELEGRAM_CHAT_ID }}
        run: node telegram-poll.mjs

      - name: Install automation dependencies
        if: steps.poll.outputs.has_approved == 'true'
        working-directory: automation
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        if: steps.poll.outputs.has_approved == 'true'
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Apply approved requests with accepted FIX10
        if: steps.poll.outputs.has_approved == 'true'
        working-directory: automation
        env:
          APPROVED_IDS: ${{ steps.poll.outputs.approved_ids }}
          VARDIYA_ADMIN_EMAIL: ${{ secrets.VARDIYA_ADMIN_EMAIL }}
          VARDIYA_ADMIN_PASSWORD: ${{ secrets.VARDIYA_ADMIN_PASSWORD }}
          VARDIYA_TELEGRAM_BOT_TOKEN: ${{ secrets.VARDIYA_TELEGRAM_BOT_TOKEN }}
          VARDIYA_TELEGRAM_CHAT_ID: ${{ secrets.VARDIYA_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set +e
          rc=0
          IFS=',' read -ra IDS <<< "$APPROVED_IDS"
          for REQUEST_ID in "${IDS[@]}"; do
            [ -z "$REQUEST_ID" ] && continue
            echo "Applying request: $REQUEST_ID"
            REQUEST_ID="$REQUEST_ID" node request-runner.mjs || rc=1
          done
          exit $rc

      - name: Upload Telegram poll report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-free-poll-${{ github.run_number }}
          path: |
            automation/telegram-poll-output.json
            automation/request-output.json
          if-no-files-found: warn
          retention-days: 14
