name: TurkMedya Telegram Request Approval

on:
  repository_dispatch:
    types: [telegram-vardiya-request]

concurrency:
  group: turkmedya-telegram-request-${{ github.event.client_payload.request_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-request:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout accepted FIX10 branch
        uses: actions/checkout@v4
        with:
          ref: v62-weekly-auto-test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install automation dependencies
        working-directory: automation
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Apply approved request
        working-directory: automation
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          VARDIYA_ADMIN_EMAIL: ${{ secrets.VARDIYA_ADMIN_EMAIL }}
          VARDIYA_ADMIN_PASSWORD: ${{ secrets.VARDIYA_ADMIN_PASSWORD }}
          VARDIYA_TELEGRAM_BOT_TOKEN: ${{ secrets.VARDIYA_TELEGRAM_BOT_TOKEN }}
          VARDIYA_TELEGRAM_CHAT_ID: ${{ secrets.VARDIYA_TELEGRAM_CHAT_ID }}
        run: node request-runner.mjs

      - name: Upload request report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-request-${{ github.event.client_payload.request_id }}-${{ github.run_number }}
          path: automation/request-output.json
          if-no-files-found: warn
          retention-days: 30
